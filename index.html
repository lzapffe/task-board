<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task board</title>
<!-- Safety: only load code from this site, only talk to Google Apps Script, fonts from Google Fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1630">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="connect.css">
</head>
<body>
<div class="app" id="app">
  <div class="top" id="top"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="tray" id="tray" hidden></div>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="loading">Loading your tasks…</div></main>
  <div class="add" id="add">
    <div class="selbar" id="selbar" hidden></div>
    <div class="sugg" id="sugg"></div>
    <div class="addrow">
      <label for="qa">+</label>
      <input id="qa" autocomplete="off" placeholder="Add a task. Enter puts it on the day you're looking at. Words: tomorrow, fri, 09:15, ! (must), due 15/11, #tag or #category">
      <span class="kbd" id="kbdhint"></span>
    </div>
  </div>
</div>


<!-- Shown the first time on a device (or after "Forget"): where to connect and the key. -->
<div class="connect" id="connect" hidden>
  <form class="connect-box" id="connectForm" autocomplete="off">
    <h1>Task board</h1>
    <p>Connect this device to your Assistant hub. You only do this once per device.</p>
    <label for="cUrl">Hub web link (ends in /exec)</label>
    <input id="cUrl" type="url" required spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="cKey">App key</label>
    <input id="cKey" type="password" required spellcheck="false" placeholder="64 letters and numbers">
    <p class="connect-err" id="cErr" hidden></p>
    <button type="submit" class="btn">Connect</button>
    <p class="connect-note">The link and key are saved only in this browser on this device.</p>
  </form>
</div>

<script src="connect.js"></script>
<script src="app.js"></script>
</body>
</html>
