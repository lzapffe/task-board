<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Security: scripts and styles only from this site (and fonts from Google Fonts);
       data only to Google Apps Script. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#23402F">
  <title>SPARK-tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
  <!-- Connect screen: shown until the web app link and key are saved on this device. -->
  <div id="connect" class="connect" hidden>
    <form id="connectForm" class="connect-box">
      <h1>SPARK-tracker</h1>
      <p>Koble til regnearket ditt. Lenken og nøkkelen lagres bare i denne nettleseren.</p>
      <label for="cUrl">Lenke til nettappen (slutter på /exec)</label>
      <input id="cUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      <label for="cKey">Appnøkkel</label>
      <input id="cKey" type="password" autocomplete="off" spellcheck="false">
      <p id="cErr" class="err" hidden></p>
      <button type="submit" class="btn primary">Koble til</button>
    </form>
  </div>

  <!-- The app: side panel + main area. -->
  <div id="shell" class="shell" hidden>
    <nav id="side" class="side" aria-label="Sider"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <!-- Quick capture button (goes to Innboks). -->
  <button id="fab" class="fab" type="button" aria-label="Hurtignotat" hidden>+</button>

  <!-- Side drawer for editing one item. -->
  <div id="drawerBg" class="drawer-bg" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></aside>

  <!-- Short messages ("Lagret"). -->
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js?v=19"></script>
</body>
</html>
